<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro de curso</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 360px;
            height: 640px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .alert-small {
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app-container">

 
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6>Retiro de curso</h6>
        <a href="main.html" class="btn btn-sm btn-secondary">Volver</a>
    </div>

 
    <div class="alert alert-warning alert-small text-center">
        El retiro de un curso es irreversible. Verifique la información antes de continuar.
    </div>

    <label>Ciclo</label>
<input type="text" class="form-control mb-3" value="2026 - I" readonly>

    <label>Seleccione el curso</label>
    <select class="form-control mb-3">
        <option>Curso1</option>
        <option>Curso2</option>
        <option>Curso3</option>
        <option>Curso4</option>
    </select>

   
    <label>Motivo del retiro</label>
    <textarea class="form-control mb-3" rows="3" placeholder="Ingrese el motivo"></textarea>

    <label>Código de alumno</label>
    <input type="text" class="form-control mb-3" placeholder="Ingrese su código">

   
    <button class="btn btn-danger btn-block">
        Confirmar retiro
    </button>

 
    <p class="text-center mt-3" style="font-size: 12px;">
        Al confirmar, acepta los términos del retiro académico.
    </p>

</div>

</body>
</html>
