<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

     .app-container {
    width: 360px;
    height: 640px; /* tamaño tipo celular */
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    overflow-y: auto; /* permite scroll si el contenido crece */
}

        .btn-custom {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="app-container">
<br>
    <h4 class="text-center mb-3">Restablecer contraseña</h4>
<br>
    <label>Código de alumno</label>
    <input type="text" class="form-control mb-3" placeholder="Ingrese su código">


    <label>Correo personal</label>
    <input type="email" class="form-control mb-3" placeholder="Ingrese su correo">

 
    <label>Documento (DNI)</label>
<input type="text" class="form-control mb-2" placeholder="Ingrese su DNI">

<p style="font-size: 13px; color: #555; text-align: center;">
    <br>
    Recibirás un correo con instrucciones para restablecer tu contraseña.<br>
    El mensaje incluirá un enlace seguro para crear una nueva contraseña.
</p>
   <br>
    <button class="btn btn-success btn-custom">Enviar solicitud</button>

    <p class="text-center mt-3">
        <a href="index.html">Volver al login</a>
    </p>

</div>

</body>
</html>
