<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas del curso</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 360px;
            height: 690px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .card-custom {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .nota-alta {
            color: green;
            font-weight: bold;
        }
        .nota-baja {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="app-container">

   
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6>Notas del curso</h6>
        <a href="main.html" class="btn btn-sm btn-secondary">Volver</a>
    </div>

   
    <div class="card-custom text-center">
        <strong>Nombre del curso</strong><br>
        <small>Nombre del profesor</small>
    </div>

   
 <div class="card-custom">

    <table class="table table-sm text-center">
        <thead>
            <tr>
                <th>Evaluación</th>
                <th>Nota</th>
                <th>Porcentaje</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Práctica 1</td>
                <td><span class="nota-alta">14</span></td>
                <td>10%</td>
            </tr>
            <tr>
                <td>Práctica 2</td>
                <td><span class="nota-alta">17</span></td>
                <td>10%</td>
            </tr>
            <tr>
                <td>Parcial</td>
                <td><span class="nota-alta">15</span></td>
                <td>30%</td>
            </tr>
            <tr>
                <td>Práctica 3</td>
                <td><span class="nota-baja">05</span></td>
                <td>10%</td>
            </tr>
            <tr>
                <td>Final</td>
                <td><span class="nota-alta">18</span></td>
                <td>40%</td>
            </tr>
        </tbody>
    </table>

</div>


    <div class="card text-center mb-3">
        <div class="card-body">
            <h6>Promedio Final</h6>
            <h3 class="nota-alta">16.0</h3>
        </div>
    </div>

 
    <div class="card-custom">
        <p><strong>Ciclo:</strong> 2026-I</p>
        <p><strong>Créditos:</strong> 4</p>
        <p><strong>Estado:</strong> Aprobado </p>
    </div>

</div>

</body>
</html>
